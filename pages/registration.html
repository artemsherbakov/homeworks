<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <h1 >Login <span class="middle">|</span> <span class="second">Register</span></h1> 
    <h3 class="enter">Enter your email and password to register.</h3>
    <form action="#">
    <input type="text" id="username" placeholder="Username">
    <input type="text" id="email" placeholder="Enter your email address">
    <input type="password" id="password" placeholder="Password">
    <input type="password" id="confirmpassword" placeholder="Confirm Password"> 
    <button class="btn1">Register</button>
    <h3 class="or">Or register with</h3> 
    <button class="btn2">Continue with Google</button>
    <button class="btn3">Continue with Facebook</button>
    </form>
</body>
</html>
